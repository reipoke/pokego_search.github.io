<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケGO 検索ワードジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>ポケGO <span class="accent">検索ワード</span>ジェネレーター</h1>
    </div>
  </header>

  <main>

    <div class="top-section">

      <div class="result-row">
        <div class="field-wrap">
          <label class="field-label" for="result">検索ワード</label>
          <textarea id="result" readonly placeholder="ポケモンを選択すると番号が出ます"></textarea>
        </div>
        <button class="btn-primary" onclick="copyText()" id="copyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          コピー
        </button>
      </div>

      <div class="search-row">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="名前 or 図鑑番号で絞り込み…" oninput="filterPokemon()">
          <button class="clear-btn" id="clearBtn" onclick="clearSearch()" aria-label="検索をクリア" style="display:none">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="count-pill">
          <span class="count-num" id="countDisplay">0</span>
          <span class="count-label">匹選択中</span>
        </div>
      </div>

    </div>

    <div class="scroll-area">
      <div class="grid" id="pokemonGrid"></div>
      <div class="no-results" id="noResults" style="display:none">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="opacity:.4">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>「<span id="noResultsQuery"></span>」に一致するポケモンが見つかりません</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
